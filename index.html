<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>电气控制接线练习</title>
<style>
  :root { --bg: #03050b; --card: rgba(26,32,56,.82); --edge: rgba(170,190,255,.18); --ink: #e8ecff; --dim: #8e97bd; --acc: #7c9cff; --acc2: #b18cff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #e9eef6; --card: rgba(255,255,255,.95); --edge: rgba(71,85,105,.22); --ink: #0f172a; --dim: #475569; --acc: #4f46e5; --acc2: #7c3aed; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background-image: radial-gradient(circle at 30% 20%, rgba(110,130,255,.16), transparent 45%), radial-gradient(rgba(170,190,255,.10) 1px, transparent 1.4px); background-size: auto, 26px 26px; }
  main { max-width: 880px; margin: 0 auto; padding: 56px 16px; }
  .kicker { color: var(--acc); font-weight: 700; letter-spacing: 2px; font-size: 13px; }
  h1 { margin: 8px 0 6px; font-size: clamp(26px, 5vw, 40px); background: linear-gradient(90deg, var(--ink), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { color: var(--dim); margin: 0 0 32px; line-height: 1.7; }
  a.card { display: block; text-decoration: none; color: inherit; padding: 22px 24px; border-radius: 22px; background: var(--card); border: 1px solid var(--edge);
    box-shadow: 0 20px 44px -22px rgba(0,0,0,.7); transition: transform .35s cubic-bezier(.34,1.56,.64,1), border-color .2s, box-shadow .2s; margin-bottom: 16px; }
  a.card:hover { transform: translateY(-3px); border-color: var(--acc); box-shadow: 0 24px 50px -20px var(--acc); }
  a.card:active { transform: scale(.98); }
  .no { color: var(--acc); font-weight: 700; font-size: 14px; }
  .t { font-size: 22px; font-weight: 700; margin: 6px 0; }
  .d { color: var(--dim); font-size: 14px; line-height: 1.7; }
  footer { margin-top: 40px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="kicker">WIRING LAB · zcq</div>
  <h1>电气控制接线练习</h1>
  <p class="sub">照着原理图在实物板上连线，检查接线，再合上空开、按按钮观察现象。电脑、希沃白板、平板都能用，建议横屏、全屏使用。</p>
  <a class="card" href="2.2/">
    <div class="no">项目 2.2</div>
    <div class="t">三相笼型异步电动机 电气互锁正反转控制</div>
    <div class="d">教材图 2-4 / 图 2-5 · 30 根线 · 入口出口法提示 · 全部正确接法（3,542,940 种）· 仿真试车</div>
  </a>
  <footer>依据《电气控制技术实训（第3版）》项目二。网页离线可用，接线进度保存在本机浏览器。</footer>
</main>
</body>
</html>

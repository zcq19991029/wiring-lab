<script>
// 公共部分：画布、配色、画笔、电路求解器、时间轴与仿真
const W = 1920, H = 1080, FPS_SIM = 60;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"Microsoft YaHei", "PingFang SC", sans-serif';
const C = {
  ink: '#1f2937', dim: '#64748b', faint: '#cbd5e1',
  L1: '#eab308', L2: '#16a34a', L3: '#ef4444', ctrl: '#9f1239', N: '#2563eb',
  cur: '#f97316', trace: '#0ea5e9', bad: '#e11d48', ok: '#16a34a', gold: '#f59e0b',
};
const PH = ['L1', 'L2', 'L3'];
// 导线颜色：U 相黄、V 相绿、W 相红，控制线深红，零线蓝
const netColor = n => n === 'N' ? C.N : /^(L1|U)/.test(n) ? C.L1 : /^(L2|V)/.test(n) ? C.L2 : /^(L3|W)/.test(n) ? C.L3 : C.ctrl;
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ---------- 画笔 ----------
function text(s, x, y, size = 24, color = C.ink, align = 'center', weight = 'normal', stroke = null) {
  g.save(); g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke[1]; g.strokeStyle = stroke[0]; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
function poly(pts, color = C.ink, w = 3, dash = null) {
  if (pts.length < 2) return;
  g.save(); g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.stroke(); g.restore();
}
// 电流：橙色光带 + 流动的亮点
function flow(pts, w, t, color = C.cur) {
  g.save(); g.shadowColor = color; g.shadowBlur = 12; poly(pts, color, w + 3); g.restore();
  g.save(); g.strokeStyle = '#fff7c2'; g.lineWidth = Math.max(2, w - 1); g.lineCap = 'round';
  g.setLineDash([5, 18]); g.lineDashOffset = -t * 110;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.stroke(); g.restore();
}
// 实物板上的电流：细的流动亮点，不盖住导线颜色
function flowLight(pts, t) {
  g.save(); g.strokeStyle = '#fb923c'; g.lineWidth = 3; g.lineCap = 'round'; g.shadowColor = '#f97316'; g.shadowBlur = 6;
  g.setLineDash([4, 14]); g.lineDashOffset = -t * 90;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.stroke(); g.restore();
}
function glowPoly(pts, color, w) { g.save(); g.shadowColor = color; g.shadowBlur = 16; poly(pts, color, w); g.restore(); }
// 截取折线的前 f 部分（画线动画）
function partial(pts, f) {
  if (f >= 1) return pts; if (f <= 0) return [pts[0]];
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let need = L * f; const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (need >= seg[i - 1]) { out.push(pts[i]); need -= seg[i - 1]; continue; }
    const k = need / seg[i - 1]; out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k]); break;
  }
  return out;
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function dot(x, y, r, color) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = color; g.fill(); }
// 标签气泡
function tag(s, x, y, color, size = 22) {
  g.save(); g.font = `bold ${size}px ${FONT}`; const w = g.measureText(s).width + 18;
  rrect(x - w / 2, y - size * 0.75, w, size * 1.5, 8, color); g.restore();
  text(s, x, y + 1, size, '#fff', 'center', 'bold');
}

// ---------- 电路求解 ----------
// edges: {id, a, b, on(s) 是否导通（默认导通）, load 是否负载}
// 返回 cur：有电流流过的边；pot：带电（与电源相连、未经负载）的节点
const _solveCache = new Map();
function solve(name, edges, s, srcs, sinks, key) {
  const ck = name + '|' + key; if (_solveCache.has(ck)) return _solveCache.get(ck);
  const act = edges.filter(e => !e.on || e.on(s));
  const adj = new Map(); const add = (n, e) => { if (!adj.has(n)) adj.set(n, []); adj.get(n).push(e); };
  act.forEach(e => { add(e.a, e); add(e.b, e); });
  const S = new Set(srcs), T = new Set(sinks);
  const bfs = (starts, skip, stop, noLoad) => {
    const seen = new Set(starts), q = [...starts];
    while (q.length) {
      const n = q.pop(); if (stop.has(n) && !starts.includes(n)) continue;
      for (const e of adj.get(n) || []) {
        if (e === skip || (noLoad && e.load)) continue;
        const m = e.a === n ? e.b : e.a; if (!seen.has(m)) { seen.add(m); q.push(m); }
      }
    }
    return seen;
  };
  const pot = bfs(srcs, null, T, true), cur = new Set();
  for (const e of act) {

// 随机一种完整接法（每个点各随机选一种）

// 学生接线的连通关系（并查集）

// ---------- 连线 ----------
const dirOf = k => /\.(t\d)$/.test(k) ? -1 : 1; // 上排端子向上出线，下排和按钮端子向下出线
function route(a, b, lane) {
  const A = TP[a], B = TP[b], da = dirOf(a), db = dirOf(b), d = 16 + lane * 7;
  // 从下排端子接到更高处的上排端子：先向下出线，再从目标元件侧边绕上去，不横穿元件
  if (da > 0 && db < 0 && B[1] < A[1]) { const gx = B[0] - 35 - lane * 4, y1 = A[1] + d, y2 = B[1] - d; return [A, [A[0], y1], [gx, y1], [gx, y2], [B[0], y2], B]; }
  if (da < 0 && db > 0 && A[1] < B[1]) return route(b, a, lane).reverse();
  const A1 = [A[0], A[1] + da * d], B1 = [B[0], B[1] + db * d];
  const ym = da === db ? (da < 0 ? Math.min(A1[1], B1[1]) : Math.max(A1[1], B1[1])) : (A1[1] + B1[1]) / 2;
  const pts = [A, A1, [A[0], ym], [B[0], ym], B1, B];
  return pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
}
const countAt = k => PS.wires.filter(w => w.a === k || w.b === k).length;
function addWire(a, b, color, cable) {

  if (PS.wires.some(w => (w.a === a && w.b === b) || (w.a === b && w.b === a))) return say('这两个端子之间已经有线了', C.bad);
  for (const k of [a, b]) if (countAt(k) >= 2) return say(`${termName(k)} 已经接满两根线，换到同一个点的其他端子上接`, C.bad, 6);
  const key = color === 'auto' ? (REF_NET[a] || REF_NET[b] || '1') : color;
  const pts = route(a, b, PS.wires.length % 5);
  const w = { id: ++wid, a, b, net: key, pts };
  if (cable) Object.assign(w, { born: now(), fromS: resample(cable, 48), toS: resample(pts, 48) });
  PS.wires.push(w);
  fx('burst', { x: TP[a][0], y: TP[a][1], col: netColor(key) }); fx('burst', { x: TP[b][0], y: TP[b][1], col: netColor(key) }); if (!cable) fx('sweep', { pts, col: netColor(key) });

// 折线按长度均匀取 n 个点（线缆落位动画用）
function resample(pts, n) {
  const seg = [], out = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  for (let j = 0; j < n; j++) { let need = L * j / (n - 1), i = 0; while (i < seg.length - 1 && need > seg[i]) { need -= seg[i]; i++; } const k = seg[i] ? Math.min(1, need / seg[i]) : 0; out.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]); }
  return out;
}
// 线缆：从端子拉出来的一条下垂的贝塞尔曲线（像节点编辑器里的连线）
function cablePts(A, E, sagA, sagE) {
  const c1 = [A[0], A[1] + sagA], c2 = [E[0], E[1] + sagE], out = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40, u = 1 - t; out.push([u * u * u * A[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * E[0], u * u * u * A[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * E[1]]); }
  return out;
}
const backOut = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const wireColorKey = from => PS.color === 'auto' ? (REF_NET[from] || '1') : PS.color;
// 弹簧：值 x 追目标，带一点回弹（空开拨杆、按钮按压用）
// 每帧拆成不超过 1/240 秒的小步来算（半隐式欧拉），帧率低（切换标签页、卡顿）时也不会越算越大；万一算坏了就直接复位
function spring(key, target, dt, k = 320, d = 20) {
  const o = PS.spr[key] || (PS.spr[key] = { x: target, v: 0 });
  const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) { o.v += (k * (target - o.x) - d * o.v) * h; o.x += o.v * h; }
  if (!isFinite(o.x) || !isFinite(o.v) || Math.abs(o.x - target) > 3) { o.x = target; o.v = 0; }
  return o.x;
}
// 接线是否全部正确（不弹提示、不改界面），按接线变化缓存：正确时原理图自动同步显示电流
let okSig = null, okVal = false;
function wiringOK() {
  const sig = sigOf(); if (sig === okSig) return okVal; okSig = sig;
  const parent = {}; const f = x => parent[x] === undefined || parent[x] === x ? (parent[x] = x) : (parent[x] = f(parent[x]));
  PS.wires.forEach(w => { parent[f(w.a)] = f(w.b); });
  const nets = [...new Set(Object.values(REF_NET))];
  const joined = nets.every(n => new Set(Object.keys(REF_NET).filter(k => REF_NET[k] === n).map(f)).size === 1);
  const groups = {}; PS.wires.forEach(w => [w.a, w.b].forEach(k => (groups[f(k)] = groups[f(k)] || new Set()).add(REF_NET[k] || '×')));
  return (okVal = joined && Object.values(groups).every(g => g.size === 1));
}

// ---------- 电路：学生接的线 + 元件内部通断 ----------
function edges() {

const sigOf = () => PS.wires.map(w => w.a + '-' + w.b).join(',');
function solveP(s) {

}
// 从每一相电源出发（不经过负载），看能到达哪些端子：用来判断短路和电动机相序
function phaseReach(s) {
  const E = edges().filter(e => !e.load && (!e.on || e.on(s)));
  const adj = new Map(); E.forEach(e => { [[e.a, e.b], [e.b, e.a]].forEach(([u, v]) => { if (!adj.has(u)) adj.set(u, []); adj.get(u).push(v); }); });
  const reach = QF_POLES.map((_, i) => { const seen = new Set(['QF.t' + i]), q = ['QF.t' + i]; while (q.length) { const n = q.pop(); for (const m of adj.get(n) || []) if (!seen.has(m)) { seen.add(m); q.push(m); } } return seen; });
  let short = null;
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) if (reach[i].has('QF.t' + j)) short = [QF_POLES[i], QF_POLES[j]];
  const fr = [0, 1, 2].map(k => [0, 1, 2].filter(p => reach[p].has('FR.b' + k)));

}

// ---------- 仿真（每帧）----------
let last = performance.now() / 1000, simR = null, motor = { state: '停止', dir: 0 };
function step(tnow) {

// ---------- 接线检查：按“点”比较，接法不同但电气上相同也算对 ----------
function check() {
  const parent = {}; const f = x => parent[x] === undefined || parent[x] === x ? (parent[x] = x) : (parent[x] = f(parent[x]));
  PS.wires.forEach(w => { parent[f(w.a)] = f(w.b); });
  const errs = [], gaps = [], bad = new Set(), miss = new Set();
  const nets = [...new Set(Object.values(REF_NET))];
  for (const n of nets) {
    const ts = Object.keys(REF_NET).filter(k => REF_NET[k] === n), roots = new Set(ts.map(f));
    if (roots.size > 1) gaps.push([n, ts]);
  }
  const groups = {}; PS.wires.forEach(w => [w.a, w.b].forEach(k => (groups[f(k)] = groups[f(k)] || new Set()).add(k)));
  for (const r in groups) {
    const ks = [...groups[r]], ns = new Set(ks.map(k => REF_NET[k] || '×'));
    if (ns.size > 1) {
      const names = [...ns].map(n => n === '×' ? '不该接线的端子' : netLabel(n));
      errs.push(`错接：${names.join(' 和 ')} 被连在了一起`);
      PS.wires.forEach(w => { if (ks.includes(w.a)) bad.add(w.id); });
    }
  }
  // 只标出第一个没连通的点，免得满屏都在闪
  if (gaps.length) gaps[0][1].forEach(k => miss.add(k));
  const gapText = ([n, ts]) => `${netLabel(n)} 没有连通（应连在一起：${ts.map(termName).join('、')}）`;
  const issues = errs.concat(gaps.length > 3 ? [gapText(gaps[0]), `还有 ${gaps.length - 1} 个点没有接通（打开提示，按顺序接）`] : gaps.map(gapText));
  PS.checked = { ok: issues.length === 0, issues, bad, miss };
  fx(PS.checked.ok ? 'scan' : 'flash', { col: PS.checked.ok ? '#6ee7b7' : C.bad });
  if (PS.checked.ok) say('接线全部正确！合上空开 QF，按 SB2、SB1、SB3 观察现象。', C.ok, 10);
  else say(errs.length ? `有 ${errs.length} 处错接（红色发光的线）：${errs[0].replace('错接：', '')}` : `还有 ${gaps.length} 个点没接通，黄圈标出了第一个`, C.bad, 10);
}

    const r3 = el('div', 'row'); WIRE_SIZES.forEach(([v, name]) => r3.append(chip('', `<span class="ln" style="height:${v}px;background:var(--ink)"></span>`, name, PS.wireW === v, () => setWireW(v)))); p.append(r3);
  });
  B.theme.onclick = () => openPop(B.theme, p => {
    p.append(el('h4', '', '主题（按教室光线选）'));
    const r = el('div', 'row'); Object.keys(THEMES).forEach(k => { const t = THEMES[k]; r.append(chip('', `<span class="th" style="background:linear-gradient(135deg, ${t.TH.bg} 55%, ${t.TH.acc})"></span>`, t.name, themeName === k, () => { applyTheme(k); say('已切换到“' + t.name + '”主题', C.ink, 2); })); }); p.append(r);
  });

  // ---------- 悬停提示（只给鼠标用） ----------
  tb.addEventListener('pointerover', e => { const b = e.target.closest('.tb-b'); if (!b || e.pointerType !== 'mouse') return; tip.textContent = b.dataset.tip; const a = b.getBoundingClientRect(), t = tip.getBoundingClientRect();
    let x = a.left + a.width / 2 - t.width / 2, y = S.dock === 'bottom' ? a.top - t.height - 10 : a.bottom + 10; if (S.dock === 'left') { x = a.right + 10; y = a.top + a.height / 2 - t.height / 2; } if (S.dock === 'right') { x = a.left - t.width - 10; y = a.top + a.height / 2 - t.height / 2; }
    Object.assign(tip.style, { left: Math.max(6, x) + 'px', top: Math.max(6, y) + 'px' }); tip.classList.add('show'); });
  tb.addEventListener('pointerout', () => tip.classList.remove('show'));

  // ---------- 拖动与吸边 ----------
  function place(node) {
    const w = node.offsetWidth, h = node.offsetHeight, m = 12;
    let x, y;
    if (S.dock === 'top' || S.dock === 'bottom') { x = S.pos * innerWidth - w / 2; y = S.dock === 'top' ? m : innerHeight - h - m; }
    else { y = S.pos * innerHeight - h / 2; x = S.dock === 'left' ? m : innerWidth - w - m; }
    node.style.left = Math.max(m, Math.min(innerWidth - w - m, x)) + 'px'; node.style.top = Math.max(m, Math.min(innerHeight - h - m, y)) + 'px';
  }
  function layout(anim) {
    tb.classList.toggle('v', S.dock === 'left' || S.dock === 'right');
    tb.classList.toggle('hide', S.collapsed); orb.classList.toggle('hide', !S.collapsed);
    place(S.collapsed ? orb : tb);
    if (S.collapsed) { orb.style.transform = anim ? 'scale(1.15)' : ''; if (anim) setTimeout(() => (orb.style.transform = ''), 220); }
  }
  function draggable(node, handle, onTap) {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault(); handle.setPointerCapture(e.pointerId); closePop();
      const r = node.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, sx = e.clientX, sy = e.clientY; let moved = false;
      const mv = ev => { if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return; moved = true; node.classList.add('dragging');
        node.style.left = ev.clientX - dx + 'px'; node.style.top = ev.clientY - dy + 'px'; };
      const up = ev => {
        handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
        node.classList.remove('dragging');
        if (!moved) { if (onTap) onTap(); return; }
        const b = node.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        const d = { left: cx, right: innerWidth - cx, top: cy, bottom: innerHeight - cy };
        S.dock = Object.keys(d).reduce((a, k) => d[k] < d[a] ? k : a, 'top');
        S.pos = (S.dock === 'top' || S.dock === 'bottom') ? cx / innerWidth : cy / innerHeight; keep();
        tb.classList.toggle('v', S.dock === 'left' || S.dock === 'right'); place(node); // 先变方向再吸边，弹簧过渡
      };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
    });
  }
  draggable(tb, grip);
  draggable(orb, orb, () => { S.collapsed = false; keep(); layout(); tb.style.transform = 'scale(.6)'; requestAnimationFrame(() => (tb.style.transform = '')); });
  addEventListener('resize', () => layout());

  // ---------- 跟着主题和状态刷新 ----------
  let lastTheme = '';
  function sync() {
    if (lastTheme !== themeName + C.ctrl) {
      lastTheme = themeName + C.ctrl; const r = document.documentElement.style, dark = THEMES[themeName].dark;
      const V = { '--tb-bg': TH.cardTop, '--tb-bg2': TH.cardBot, '--edge': TH.edge, '--ink': C.ink, '--dim': C.dim, '--acc': TH.acc, '--acc2': TH.acc2, '--hov': TH.btnHov,
        '--press': dark ? 'rgba(255,255,255,.14)' : 'rgba(15,23,42,.12)', '--shadow': dark ? 'rgba(0,0,0,.7)' : 'rgba(15,23,42,.28)', '--ok': C.ok, '--bad': C.bad,
        '--off': dark ? 'rgba(120,120,128,.36)' : '#e9e9eb', '--tip': dark ? 'rgba(10,14,28,.95)' : 'rgba(15,23,42,.9)' };
      for (const k in V) r.setProperty(k, V[k]);
      document.body.style.background = TH.bg;
    }
    B.hint.classList.toggle('hint-on', !!PS.hint); B.hint.setAttribute('aria-pressed', !!PS.hint);
    B.undo.disabled = !PS.wires.length; B.del.disabled = !PS.selWire; B.clear.disabled = !PS.wires.length && !B.clear.classList.contains('holding');
    const pc = PS.color === 'auto' ? C.ink : netColor(PS.color); penDot.style.background = pc; orb.style.setProperty('--orb-ring', pc);
    const full = !!document.fullscreenElement; B.full.querySelector('.ic').innerHTML = full ? I.exitFull : I.full; B.full.querySelector('.lb').textContent = full ? '退出' : '全屏';
    requestAnimationFrame(sync);
  }
  layout(); sync();
})();

</script>
